name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Pylint
        run: python -m pip install pylint==4.0.8
      # This cheat sheet intentionally includes bad examples and standalone
      # expressions. Show all advice, but use errors as the blocking criterion.
      - name: Show all Pylint findings (advisory)
        run: python -m pylint --exit-zero --persistent=n cheat_sheet.py
      - name: Check for errors (required)
        run: python -m pylint --errors-only --persistent=n cheat_sheet.py
